<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACA-FIS - Login | Field Intelligence System</title>
    <meta name="theme-color" content="#1a5632">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 2.5rem;
        }
        .toggle-password {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
            padding: 0.3rem;
            line-height: 1;
        }
        .toggle-password:hover {
            color: var(--primary);
        }
        #passwordStrength {
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🛡️</div>
                <h1>ACA-FIS</h1>
                <p class="login-subtitle">Field Intelligence System</p>
                <p class="login-agency">Kenya Anti-Counterfeit Authority</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="officer@aca.go.ke" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Show password">
                            👁️
                        </button>
                    </div>
                    <small id="passwordStrength" style="display:block; margin-top:0.3rem;"></small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <div id="loginError" class="alert alert-error" style="display:none;"></div>
            <div class="login-footer">
                <p>🔒 Secure Government System</p>
                <p class="login-version">v2.0 | PWA Enabled</p>
            </div>
        </div>
        <div class="login-badge">
            <span>🇰🇪 Republic of Kenya</span>
            <span>Official Use Only</span>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');
            const passwordInput = document.getElementById('password');
            const strengthEl = document.getElementById('passwordStrength');
            const toggleBtn = document.querySelector('.toggle-password');

            // ---- Password strength indicator ----
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                let strength = 0;
                if (val.length >= 8) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[^A-Za-z0-9]/.test(val)) strength++;

                const levels = [
                    { text: 'Weak', color: '#dc2626' },
                    { text: 'Fair', color: '#d97706' },
                    { text: 'Good', color: '#c9a827' },
                    { text: 'Strong', color: '#16a34a' }
                ];
                const level = strength >= 3 ? levels[strength] : levels[0];
                strengthEl.textContent = `Password strength: ${level.text}`;
                strengthEl.style.color = level.color;
            });

            // ---- Toggle password visibility ----
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
            });

            // ---- Login submission ----
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;

                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    const doc = await db.collection('users').doc(user.uid).get();
                    const role = doc.exists ? doc.data().role : 'officer';
                    localStorage.setItem('acfms_user_role', role);
                    localStorage.setItem('acfms_user_uid', user.uid);
                    logAction('login', { email: user.email, role });
                    window.location.href = role === 'admin' ? 'dashboard.html' : 'report.html';
                } catch (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
